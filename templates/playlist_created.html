<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TunePalette</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #dedbd4;
            color: #2e2d2a;
        }

        .screen {
            width: 100%;
            max-width: 430px;
            height: 100dvh;

            margin: 0 auto;

            padding:
                max(24px, env(safe-area-inset-top))
                22px
                max(22px, env(safe-area-inset-bottom));

            background: #f3f1eb;

            display: flex;
            flex-direction: column;
        }

        .title {
            margin: 4px 0 0;

            text-align: center;

            font-size: 31px;
            font-weight: 650;
            letter-spacing: -1px;
        }

        .title span {
            color: #8f8c86;
        }

        .result {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .check {
            width: 82px;
            height: 82px;

            margin-bottom: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e3e0d9;

            color: #4d4a45;

            font-size: 38px;
            font-weight: 500;
        }

        h1 {
            margin: 0;

            font-size: 29px;
            font-weight: 650;
            letter-spacing: -0.7px;
        }

        .message {
            margin:
                10px
                0
                0;

            color: #77736b;

            font-size: 15px;
        }

        .actions {
            display: flex;
            flex-direction: column;

            gap: 11px;
        }

        .button {
            width: 100%;
            min-height: 58px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            text-decoration: none;

            font-size: 17px;
            font-weight: 700;

            transition:
                transform 0.12s ease;
        }

        .button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #4b4945;
            color: #f8f6f1;

            border:
                1px solid
                rgba(50, 48, 44, 0.16);
        }

        .secondary {
            background: #faf9f5;
            color: #2e2d2a;

            border:
                1px solid
                rgba(63, 60, 55, 0.14);
        }

        .icon {
            font-size: 17px;
        }

    </style>
</head>


<body>

<div class="screen">

    <header>
        <p class="title">
            Tune<span>Palette</span>
        </p>
    </header>


    <main class="result">

        <div
            class="check"
            aria-hidden="true"
        >
            ✓
        </div>

        <h1>
            Playlist Updated
        </h1>

        <p class="message">
            Your mix is ready.
        </p>

    </main>


    <div class="actions">

        <form
    action="/play-playlist/{{ playlist_id }}"
    method="post"
>
    <button
        class="button primary"
        type="submit"
    >
        <span
            class="icon"
            aria-hidden="true"
        >
            ▶
        </span>

        Play Playlist
    </button>
</form>


        <a
            class="button secondary"
            href="/settings"
        >
            <span
                class="icon"
                aria-hidden="true"
            >
                ↻
            </span>

            Create Again
        </a>

    </div>

</div>

</body>

</html>
